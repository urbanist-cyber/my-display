<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Display</title>
<style>
  :root {
    --bg: #000;            /* black background */
    --line: #3a3a3a;       /* divider lines */
    --btn: #1c1c1c;
    --btn-active: #2b6cb0;
    --text: #f2f2f2;
    --bottom-h: 22vh;      /* height of bottom bar */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }

  .screen {
    display: grid;
    grid-template-rows: 1fr var(--bottom-h);
    width: 100vw; height: 100vh;
    background: var(--bg);
    border: 1px solid var(--line);
  }

  /* ---------- TOP: YouTube + Chrome link ---------- */
  .top {
    display: grid;
    grid-template-columns: 1fr 1fr;      /* change to 3fr 2fr etc. to resize */
    border-bottom: 1px solid var(--line);
    min-height: 0;
  }
  .panel { position: relative; min-height: 0; background: #000; }
  .panel + .panel { border-left: 1px solid var(--line); }
  .panel iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  /* ---------- BOTTOM BAR ---------- */
  .bottom {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) minmax(0, 0.9fr);
    align-items: center;
    gap: 2vw;
    padding: 1.2vh 2vw;
    min-height: 0;
  }

  .qr {
    height: calc(var(--bottom-h) - 3vh);
    aspect-ratio: 1 / 1;
    background: #fff;
    border: 1px solid var(--line);
    display: grid; place-items: center;
    overflow: hidden;
  }
  .qr img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }

  .titles {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 1vh 0.8vw;
    height: calc(var(--bottom-h) - 3vh);
  }
  .titles button {
    background: var(--btn);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 0 12px;
    text-align: left;
    cursor: pointer;
    font: inherit;
    font-weight: 600;
    font-size: clamp(11px, 1.1vw, 20px);
    line-height: 1.2;
  }
  .titles button small { display: block; font-weight: 400; opacity: .6; font-size: .8em; }
  .titles button:hover { border-color: #888; }
  .titles button.active { background: var(--btn-active); border-color: #63a4ff; }
  .titles button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  .logos {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 1vh 0.6vw;
    height: calc(var(--bottom-h) - 3vh);
    justify-items: center;
    align-items: center;
  }
  .logos .logo {
    height: 100%;
    max-height: 9vh;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background: #fff;
    border: 1px solid var(--line);
    overflow: hidden;
    display: grid; place-items: center;
  }
  .logos .logo img { width: 100%; height: 100%; object-fit: contain; padding: 12%; }
</style>
</head>
<body>
<div class="screen">

  <!-- TOP -->
  <section class="top">
    <div class="panel"><iframe id="yt" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="YouTube video"></iframe></div>
    <div class="panel"><iframe id="chrome" title="Web page"></iframe></div>
  </section>

  <!-- BOTTOM -->
  <section class="bottom">
    <div class="qr"><img id="qr" alt="QR code"></div>
    <div class="titles" id="titles"></div>
    <div class="logos" id="logos"></div>
  </section>

</div>

<script>
/* =========================================================
   EDIT THIS SECTION ONLY
   ========================================================= */
const CONFIG = {
  // Any YouTube link (watch, youtu.be, or embed). Autoplays muted & loops.
  youtube: "https://www.youtube.com/watch?v=dQw4w9WgXcQ",

  // Right panel: page shown on load (usually the first title's link)
  defaultLink: "https://example.com",

  // QR image (put a file in /images and use e.g. "images/qr.png")
  qr: "images/qr.png",

  // 6 titles. Clicking one loads its link in the right panel.
  titles: [
    { title: "Title 1", link: "https://example.com" },
    { title: "Title 2", link: "https://example.com" },
    { title: "Title 3", link: "https://example.com" },
    { title: "Title 4", link: "https://example.com" },
    { title: "Title 5", link: "https://example.com" },
    { title: "Title 6", link: "https://example.com" }
  ],

  // 12 logos (put files in /images). Leave "" for a blank circle.
  logos: [
    "images/logo1.png",  "images/logo2.png",  "images/logo3.png",
    "images/logo4.png",  "images/logo5.png",  "images/logo6.png",
    "images/logo7.png",  "images/logo8.png",  "images/logo9.png",
    "images/logo10.png", "images/logo11.png", "images/logo12.png"
  ]
};
/* ========================================================= */

// ---- YouTube ----
function ytEmbed(url) {
  const m = url.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);
  if (!m) return url;
  const id = m[1];
  return `https://www.youtube.com/embed/${id}?autoplay=1&mute=1&loop=1&playlist=${id}&rel=0`;
}
document.getElementById("yt").src = ytEmbed(CONFIG.youtube);

// ---- Right panel ----
const chrome = document.getElementById("chrome");
chrome.src = CONFIG.defaultLink;

// ---- QR ----
const qr = document.getElementById("qr");
qr.src = CONFIG.qr;
qr.onerror = () => { qr.style.display = "none"; qr.parentElement.textContent = "QR"; };

// ---- Titles ----
const titlesEl = document.getElementById("titles");
CONFIG.titles.forEach((t, i) => {
  const b = document.createElement("button");
  b.innerHTML = `${t.title}<small>Connect to Google Chrome</small>`;
  if (t.link === CONFIG.defaultLink && !titlesEl.querySelector(".active")) b.classList.add("active");
  b.addEventListener("click", () => {
    chrome.src = t.link;
    titlesEl.querySelectorAll("button").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
  });
  titlesEl.appendChild(b);
});

// ---- Logos ----
const logosEl = document.getElementById("logos");
CONFIG.logos.forEach(src => {
  const d = document.createElement("div");
  d.className = "logo";
  if (src) {
    const img = document.createElement("img");
    img.src = src; img.alt = "";
    img.onerror = () => img.remove();
    d.appendChild(img);
  }
  logosEl.appendChild(d);
});
</script>
</body>
</html>
